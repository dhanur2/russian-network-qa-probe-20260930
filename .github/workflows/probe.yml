name: Russian network probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect through a volunteer Russian relay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64, csv
          lines = [line for line in open('/tmp/vpngate.csv', encoding='utf-8-sig').read().splitlines() if line and not line.startswith('*')]
          rows = [row for row in csv.DictReader(lines) if row.get('CountryShort') == 'RU' and row.get('OpenVPN_ConfigData_Base64')]
          rows.sort(key=lambda row: int(row.get('Speed') or 0), reverse=True)
          print('Russian relay candidates:', len(rows))
          for index, row in enumerate(rows[:4]):
              config = base64.b64decode(row['OpenVPN_ConfigData_Base64'])
              open(f'/tmp/ru{index}.ovpn', 'wb').write(config)
              print(index, row.get('IP'), row.get('Speed'))
          if not rows:
              raise SystemExit('No Russian OpenVPN relay listed')
          PY
          printf 'vpn\nvpn\n' > /tmp/vpn-auth
          sudo modprobe tun || true
          test -c /dev/net/tun
          before=$(curl -fsSL --max-time 10 https://api.ipify.org)
          echo "Direct IP: $before"
          connected=0
          for config in /tmp/ru*.ovpn; do
            echo "Trying $config"
            sudo openvpn --config "$config" --auth-user-pass /tmp/vpn-auth --daemon --log /tmp/ovpn.log --writepid /tmp/ovpn.pid || true
            for attempt in $(seq 1 12); do
              if grep -q 'Initialization Sequence Completed' /tmp/ovpn.log 2>/dev/null; then
                connected=1
                break
              fi
              if grep -Eq 'AUTH_FAILED|Exiting due to fatal error|Cannot open TUN' /tmp/ovpn.log 2>/dev/null; then
                break
              fi
              sleep 2
            done
            if [ "$connected" -eq 1 ]; then break; fi
            echo "Failure details for $config:"
            if [ -f /tmp/ovpn.log ]; then tail -n 25 /tmp/ovpn.log; else echo "No OpenVPN log"; fi
            sudo kill "$(cat /tmp/ovpn.pid)" 2>/dev/null || true
            sudo rm -f /tmp/ovpn.pid /tmp/ovpn.log
          done
          if [ "$connected" -ne 1 ]; then
            echo 'No relay connected; OpenVPN log tail:'
            tail -n 35 /tmp/ovpn.log || true
            exit 1
          fi
          after=$(curl -fsSL --max-time 15 https://api.ipify.org)
          echo "Connected IP: $after"
          echo "Geo result 1:"
          curl -fsSL --max-time 15 https://ipapi.co/json/ | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('ip','country_code','country_name','org')})"
          echo "Geo result 2:"
          curl -fsSL --max-time 15 "https://ipwho.is/$after" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('ip','country_code','country','connection')})"
          if [ "$before" = "$after" ]; then
            echo 'Exit IP did not change'
            exit 1
          fi