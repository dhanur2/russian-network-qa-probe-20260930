name: Russian network probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check recent Russian OpenVPN profiles
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          test -c /dev/net/tun
          before=$(curl -fsSL --max-time 10 https://api.ipify.org)
          echo "Direct IP: $before"
          printf 'vpn\nvpn\n' > /tmp/vpn-auth
          connected=0
          for ip in 77.35.43.113 188.0.217.197 79.105.117.168 212.20.43.5 45.140.95.39; do
            echo "Trying public Russian relay $ip"
            curl -fsSL --max-time 15 "https://ipspeed.info/ovpn/$ip.ovpn" -o /tmp/relay.ovpn || continue
            if grep -Eiq '^(script-security|up|down|plugin|management|route-up|ipchange|tls-verify)[[:space:]]' /tmp/relay.ovpn; then
              echo 'Config has executable directives; skipping'
              continue
            fi
            grep -E '^(remote|proto)[[:space:]]' /tmp/relay.ovpn | head -n 2
            sudo openvpn --config /tmp/relay.ovpn --auth-user-pass /tmp/vpn-auth --daemon --log /tmp/ovpn.log --writepid /tmp/ovpn.pid || true
            for attempt in $(seq 1 15); do
              if sudo grep -q 'Initialization Sequence Completed' /tmp/ovpn.log 2>/dev/null; then
                connected=1
                break
              fi
              if sudo grep -Eq 'AUTH_FAILED|Exiting due to fatal error|Cannot open TUN' /tmp/ovpn.log 2>/dev/null; then
                break
              fi
              sleep 2
            done
            if [ "$connected" -eq 1 ]; then break; fi
            echo "Failure details for $ip:"
            sudo tail -n 15 /tmp/ovpn.log || true
            sudo kill "$(cat /tmp/ovpn.pid)" 2>/dev/null || true
            sudo rm -f /tmp/ovpn.pid /tmp/ovpn.log
          done
          if [ "$connected" -ne 1 ]; then
            echo 'No Russian relay connected'
            exit 1
          fi
          after=$(curl -fsSL --max-time 20 https://api.ipify.org)
          echo "Connected IP: $after"
          curl -fsSL --max-time 15 https://ipapi.co/json/ | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('ip','country_code','country_name','org')})"
          curl -fsSL --max-time 15 "https://ipwho.is/$after" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('ip','country_code','country')})"
          test "$before" != "$after"